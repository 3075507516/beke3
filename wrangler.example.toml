# 可选：仅用于本地 Wrangler CLI 调试（如 `npx wrangler pages dev dist`）。
#
# ⚠️ 重要提示：
# 请勿直接复制提交为仓库根目录的 `wrangler.toml` 后用于 Cloudflare Dashboard 托管！
# 因为 Cloudflare Pages 一旦检测到仓库根目录存在 `wrangler.toml`，会自动切换为
# "Wrangler 管理模式" 并锁定控制台里的「Settings -> Bindings (D1 / R2 / KV)」绑定按钮，
# 导致无法在网页仪表板添加或修改 KV、D1 数据库和 R2 存储桶连接。
#
# 如需在 Cloudflare Dashboard 网页控制台直接绑定 D1 / R2 / KV：
# 保持仓库根目录不存在 `wrangler.toml`，直接在 Pages -> Settings -> Bindings 中绑定：
#   1) D1 Database: 变量名填 DB
#   2) R2 Bucket:   变量名填 R2_BUCKET
#   3) KV Namespace: 变量名填 KV
# （后端同时兼容别名及鸭子类型自动识别，绑定后重新部署一次即可生效。）

name = "fox3"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# 如仅在本地执行 `npx wrangler pages dev dist`，可临时复制本文件为 wrangler.toml（已在 .gitignore 忽略）
# 并取消下方注释、填入你自己的资源 ID：
#
# [[d1_databases]]
# binding = "DB"
# database_name = "fox3-db"
# database_id = "<your-d1-database-id>"
#
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "fox3-r2"
#
# [[kv_namespaces]]
# binding = "KV"
# id = "<your-kv-namespace-id>"
