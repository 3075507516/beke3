server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Never expose Cloudflare metadata/worker files if static dist/ is served via Nginx
    location ~ ^/(_worker\.js|_routes\.json|_redirects|_headers)$ {
        return 404;
    }

    # Standalone status fallback when Nginx serves static dist without Node/Cloudflare backend
    location = /api/status {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"success":true,"channelOnline":false,"status":"standalone","message":"Running on Nginx static mode with local IndexedDB persistence"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
