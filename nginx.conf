server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Mock/Fallback API Status for non-Cloudflare environments
    location /api/status {
        default_type application/json;
        return 200 '{"success":true,"channelOnline":false,"status":"standalone","message":"Running on Docker / VPS standalone mode with IndexedDB local persistence"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
