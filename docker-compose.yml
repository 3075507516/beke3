services:
  fox3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fox3-blog
    restart: always
    ports:
      - "8080:80"
    volumes:
      - fox3_data:/app/.data
    environment:
      - NODE_ENV=production
      - PORT=80
      - ADMIN_USERNAME=${ADMIN_USERNAME:-fox}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - MAIL_PROVIDER=${MAIL_PROVIDER:-}
      - MAIL_SENDER=${MAIL_SENDER:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURITY=${SMTP_SECURITY:-ssl}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - IMAP_HOST=${IMAP_HOST:-}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASS=${IMAP_PASS:-}

volumes:
  fox3_data:
